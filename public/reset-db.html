<!DOCTYPE html>
<html>
<head>
  <title>Reset Database - Jagat Kawruh</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
    }
    button {
      background: #f59e0b;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px;
    }
    button:hover {
      background: #d97706;
    }
    .success {
      color: #059669;
      margin-top: 20px;
    }
    .error {
      color: #dc2626;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>🔧 Reset Database Jagat Kawruh</h1>
  <p>Klik tombol di bawah untuk menghapus dan membuat ulang database.</p>
  <p style="color: #dc2626; font-size: 14px;">⚠️ Semua data akan terhapus!</p>
  
  <button onclick="resetDatabase()">Reset Database</button>
  <button onclick="window.location.href='/'">Kembali ke Home</button>
  
  <div id="status"></div>

  <script>
    async function resetDatabase() {
      const status = document.getElementById('status');
      status.innerHTML = '<p>Menghapus database...</p>';
      
      try {
        // Delete all databases
        const databases = ['JagatKawruhDB', 'NotifikasiDB', 'HelpdeskDB', 'jagat_kawruh_files'];
        
        for (const dbName of databases) {
          const deleteRequest = indexedDB.deleteDatabase(dbName);
          
          await new Promise((resolve, reject) => {
            deleteRequest.onsuccess = () => {
              console.log(`✅ ${dbName} berhasil dihapus`);
              resolve(true);
            };
            deleteRequest.onerror = () => {
              console.error(`❌ Error menghapus ${dbName}`);
              reject(deleteRequest.error);
            };
          });
        }
        
        status.innerHTML = `
          <p class="success">✅ Database berhasil direset!</p>
          <p>Silakan <a href="/">kembali ke halaman utama</a> dan login kembali.</p>
          <p style="font-size: 14px; color: #64748b;">Data default (jurusan, dll) akan otomatis di-generate.</p>
        `;
      } catch (error) {
        status.innerHTML = `<p class="error">❌ Error: ${error}</p>`;
      }
    }
  </script>
</body>
</html>
